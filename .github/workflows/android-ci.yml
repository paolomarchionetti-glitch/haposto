name: Android CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, unit test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      # No Supabase credentials in CI: BuildConfig stays empty and the app uses the local demo
      # repository, exactly like a fresh checkout without local.properties.
      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Assemble app and instrumented test APKs
        run: ./gradlew --stacktrace assembleDebug assembleDebugAndroidTest

      - name: Android lint
        run: ./gradlew --stacktrace lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
