name: Android CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, unit test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      # No Supabase/Firebase/Google credentials in CI: BuildConfig stays empty. The DEMO flavor
      # uses the local demo data; DEV and PROD are still compiled (they show a configuration error
      # at runtime, exactly like a fresh checkout without local.properties).
      - name: Unit tests
        run: ./gradlew --stacktrace testDemoDebugUnitTest

      - name: Assemble demo, dev and prod apps and instrumented test APK
        run: ./gradlew --stacktrace assembleDebug assembleDemoDebugAndroidTest

      - name: Android lint
        run: ./gradlew --stacktrace lintDemoDebug

      - name: Lint summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("app/build/reports/lint-results-*.xml"):
              issues = ET.parse(path).getroot().findall("issue")
              print(f"{path}: {len(issues)} issue(s)")
              for issue in issues:
                  loc = issue.find("location")
                  where = f"{loc.get('file', '?').split('/app/')[-1]}:{loc.get('line', '?')}" if loc is not None else "?"
                  print(f"  [{issue.get('severity')}] {issue.get('id')} {where} - {issue.get('message')}")
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  supabase-sql:
    name: Supabase SQL (migrations, seed, RLS checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      # The postgis image pre-installs PostGIS in "postgres" (schema public): use a clean database,
      # like a new Supabase project where 0001 installs it in "extensions".
      PGDATABASE: haposto
    steps:
      - uses: actions/checkout@v5

      - name: Emulate a fresh Supabase project, apply migrations and seeds
        run: |
          set -e
          createdb -T template0 haposto
          run() { echo "== $1"; psql -v ON_ERROR_STOP=1 -q -f "$1"; }
          run supabase/tests/local_only_supabase_emulation.sql
          for f in 0001_extensions 0002_schema 0003_functions 0004_rls_and_grants 0005_realtime_future \
                   0006_hardening_and_data_source 0007_accounts_and_claims 0008_plans_and_billing \
                   0009_favorites_alerts_notifications 0010_reservations_cloud 0011_public_page_stats_import \
                   0012_security_and_admin 0013_profile_consents_account 0014_explicit_grants \
                   0015_notes_links_file_offer 0016_paid_plans_and_trial \
                   0017_rome_dates_admin_plan; do
            run supabase/migrations/$f.sql
          done
          run supabase/seeds/900_example_fictional_data.sql
          run supabase/seeds/910_pseudo_realistic_dev_seed.sql
          run supabase/dev/dev_tools.sql
          # Re-running every migration must be harmless.
          for f in supabase/migrations/000[5-9]_*.sql supabase/migrations/001[0-7]_*.sql; do run "$f"; done
          # Realtime: the live status table is published exactly once.
          test "$(psql -At -c "select count(*) from pg_publication_tables where pubname = 'supabase_realtime' and tablename = 'restaurant_live_status'")" = "1"

      - name: RLS and business-rule checks
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/step8_to_17_checks.sql 2>&1 | tee checks.log | grep -E "ok:|FAIL|ERROR|TUTTI"
          grep -q "TUTTI I CONTROLLI SUPERATI" checks.log

      - name: Security, admin panel and account checks
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/step18_security_admin_checks.sql 2>&1 | tee security.log | grep -E "ok:|FAIL|ERROR|SUPERATI"
          grep -q "CONTROLLI SICUREZZA SUPERATI" security.log

      - name: Notes, links, file and offer checks (0015)
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/step19_notes_links_file_offer_checks.sql 2>&1 | tee extras.log | grep -E "ok:|FAIL|ERROR|SUPERATI"
          grep -q "CONTROLLI NOTE, LINK, FILE E OFFERTA SUPERATI" extras.log

      - name: Paid plans, trial and expiry notice checks (0016)
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/step20_paid_plans_trial_checks.sql 2>&1 | tee plans.log | grep -E "ok:|FAIL|ERROR|SUPERATI"
          grep -q "CONTROLLI PIANI E PROVA SUPERATI" plans.log

      - name: Italian dates and admin plan checks (0017)
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/step21_rome_dates_checks.sql 2>&1 | tee dates.log | grep -E "ok:|FAIL|ERROR|SUPERATI"
          grep -q "CONTROLLI DATE ITALIANE SUPERATI" dates.log

      # As in the setup guide (Parte 1): the six test users already exist in Authentication,
      # test-thief included, and both scripts are run again on the same database.
      - name: Checks in the setup guide order (six test users)
        run: |
          psql -v ON_ERROR_STOP=1 -q -c "insert into auth.users (email) values ('test-thief@haposto.test') on conflict (email) do nothing"
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/step18_security_admin_checks.sql 2>&1 | tee guide-security.log | grep -E "FAIL|ERROR|SUPERATI"
          grep -q "CONTROLLI SICUREZZA SUPERATI" guide-security.log
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/step8_to_17_checks.sql 2>&1 | tee guide-checks.log | grep -E "FAIL|ERROR|TUTTI"
          grep -q "TUTTI I CONTROLLI SUPERATI" guide-checks.log

      - name: KPI queries run on the final schema
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/ops/kpi_queries.sql > /dev/null

      - name: OpenStreetMap directory import works on a sample
        run: |
          sed -e '/^INCOLLA_QUI_IL_JSON_DI_OVERPASS$/{r supabase/tests/fixtures/overpass_sample.json' -e 'd}' \
            supabase/ops/import_osm_overpass.sql > "$RUNNER_TEMP/import_osm_ready.sql"
          psql -v ON_ERROR_STOP=1 -v import_file="$RUNNER_TEMP/import_osm_ready.sql" \
            -f supabase/tests/osm_import_check.sql 2>&1 | tee osm.log
          grep -q "IMPORT OSM OK" osm.log

      - name: DEV tools leave restaurants with a real manager alone
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/dev_tools_checks.sql 2>&1 | tee devtools.log | grep -E "ok:|FAIL|ERROR|STRUMENTI"
          grep -q "STRUMENTI DEV OK" devtools.log

      - name: DEV purge leaves no test data
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/dev/dev_purge.sql
          test "$(psql -At -c "select count(*) from public.restaurants where data_source = 'DEV_SEED'")" = "0"

      # Production project (guide, Parte 10): a Supabase project created since 30 May 2026 gives no
      # automatic privileges on new tables and sequences in public. After the migrations alone the
      # API roles must have the same table privileges as on the DEV-like database above.
      - name: New production project (no automatic grants)
        run: |
          set -e
          createdb -T template0 haposto_prod
          export PGDATABASE=haposto_prod
          run() { echo "== $1"; psql -v ON_ERROR_STOP=1 -q -f "$1"; }
          # The API roles already exist in this Postgres server.
          sed '/^create role/d' supabase/tests/local_only_supabase_emulation.sql > "$RUNNER_TEMP/new_project.sql"
          run "$RUNNER_TEMP/new_project.sql"
          psql -v ON_ERROR_STOP=1 -q -c "alter default privileges in schema public revoke all on tables from anon, authenticated, service_role" \
                                    -c "alter default privileges in schema public revoke all on sequences from anon, authenticated, service_role"
          for f in supabase/migrations/0*.sql; do run "$f"; done
          grants="select table_name, column_name, grantee, privilege_type from information_schema.column_privileges
                  where table_schema = 'public' and grantee in ('anon', 'authenticated', 'service_role')
                    and privilege_type in ('SELECT', 'INSERT', 'UPDATE')
                  union all
                  select table_name, '', grantee, privilege_type from information_schema.role_table_grants
                  where table_schema = 'public' and grantee in ('anon', 'authenticated', 'service_role')
                    and privilege_type in ('SELECT', 'INSERT', 'UPDATE', 'DELETE')
                  order by 1, 2, 3, 4"
          psql -d haposto -At -c "$grants" > "$RUNNER_TEMP/grants_dev.txt"
          psql -At -c "$grants" > "$RUNNER_TEMP/grants_prod.txt"
          test -s "$RUNNER_TEMP/grants_prod.txt"
          diff "$RUNNER_TEMP/grants_dev.txt" "$RUNNER_TEMP/grants_prod.txt"
          # What the Edge Functions do with the server role, then the usual checks (rolled back).
          psql -v ON_ERROR_STOP=1 -q -c "set role service_role" -c "select count(*) from public.plans" \
            -c "update public.billing_events set error = null where false" -c "delete from public.billing_events where false" \
            -c "update public.consumer_subscriptions set status = status where false" \
            -c "select count(*) from public.restaurant_subscriptions"
          run supabase/seeds/900_example_fictional_data.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/step8_to_17_checks.sql 2>&1 | tee prod-checks.log | grep -E "FAIL|ERROR|TUTTI"
          grep -q "TUTTI I CONTROLLI SUPERATI" prod-checks.log
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/step18_security_admin_checks.sql 2>&1 | tee prod-security.log | grep -E "FAIL|ERROR|SUPERATI"
          grep -q "CONTROLLI SICUREZZA SUPERATI" prod-security.log
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/step19_notes_links_file_offer_checks.sql 2>&1 | tee prod-extras.log | grep -E "FAIL|ERROR|SUPERATI"
          grep -q "CONTROLLI NOTE, LINK, FILE E OFFERTA SUPERATI" prod-extras.log
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/step20_paid_plans_trial_checks.sql 2>&1 | tee prod-plans.log | grep -E "FAIL|ERROR|SUPERATI"
          grep -q "CONTROLLI PIANI E PROVA SUPERATI" prod-plans.log
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/step21_rome_dates_checks.sql 2>&1 | tee prod-dates.log | grep -E "FAIL|ERROR|SUPERATI"
          grep -q "CONTROLLI DATE ITALIANE SUPERATI" prod-dates.log
          # Real directory (guide, Parte 10): the OpenStreetMap import as run from the SQL Editor.
          psql -v ON_ERROR_STOP=1 -q -f "$RUNNER_TEMP/import_osm_ready.sql" > /dev/null
          test "$(psql -At -c "select count(*) from public.restaurants where data_source = 'OSM_IMPORT'")" -gt 0

  edge-functions:
    name: Supabase Edge Functions (type check, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type check every function
        run: deno check */index.ts

      - name: Lint
        run: deno lint

      - name: Unit tests (Stripe signature, Google Play states, helpers)
        run: deno test --allow-env

  instrumented:
    name: Instrumented tests (emulator)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compose UI tests on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --stacktrace connectedDemoDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
