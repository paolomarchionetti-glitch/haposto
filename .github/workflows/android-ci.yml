name: Android CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, unit test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      # No Supabase credentials in CI: BuildConfig stays empty and the app uses the local demo
      # repository, exactly like a fresh checkout without local.properties.
      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Assemble app and instrumented test APKs
        run: ./gradlew --stacktrace assembleDebug assembleDebugAndroidTest

      - name: Android lint
        run: ./gradlew --stacktrace lintDebug

      - name: Lint summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("app/build/reports/lint-results-*.xml"):
              issues = ET.parse(path).getroot().findall("issue")
              print(f"{path}: {len(issues)} issue(s)")
              for issue in issues:
                  loc = issue.find("location")
                  where = f"{loc.get('file', '?').split('/app/')[-1]}:{loc.get('line', '?')}" if loc is not None else "?"
                  print(f"  [{issue.get('severity')}] {issue.get('id')} {where} - {issue.get('message')}")
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  supabase-sql:
    name: Supabase SQL (migrations, seed, RLS checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      # The postgis image pre-installs PostGIS in "postgres" (schema public): use a clean database,
      # like a new Supabase project where 0001 installs it in "extensions".
      PGDATABASE: haposto
    steps:
      - uses: actions/checkout@v5

      - name: Emulate a fresh Supabase project, apply migrations and seeds
        run: |
          set -e
          createdb -T template0 haposto
          run() { echo "== $1"; psql -v ON_ERROR_STOP=1 -q -f "$1"; }
          run supabase/tests/local_only_supabase_emulation.sql
          for f in 0001_extensions 0002_schema 0003_functions 0004_rls_and_grants \
                   0006_hardening_and_data_source 0007_accounts_and_claims 0008_plans_and_billing \
                   0009_favorites_alerts_notifications 0010_reservations_cloud 0011_public_page_stats_import; do
            run supabase/migrations/$f.sql
          done
          run supabase/seeds/900_example_fictional_data.sql
          run supabase/seeds/910_pseudo_realistic_dev_seed.sql
          run supabase/dev/dev_tools.sql
          # Re-running every migration must be harmless.
          for f in supabase/migrations/000[6-9]_*.sql supabase/migrations/001[01]_*.sql; do run "$f"; done

      - name: RLS and business-rule checks
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/step8_to_17_checks.sql 2>&1 | tee checks.log | grep -E "ok:|FAIL|ERROR|TUTTI"
          grep -q "TUTTI I CONTROLLI SUPERATI" checks.log

      - name: DEV purge leaves no test data
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/dev/dev_purge.sql
          test "$(psql -At -c "select count(*) from public.restaurants where data_source = 'DEV_SEED'")" = "0"

  instrumented:
    name: Instrumented tests (emulator)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compose UI tests on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --stacktrace connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
