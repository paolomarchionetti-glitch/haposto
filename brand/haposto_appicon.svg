<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HAPOSTO app icon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B4653"/>
      <stop offset="1" stop-color="#0E2933"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1EDE3"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#3BE39A"/>
      <stop offset="1" stop-color="#12A867"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#ink)"/>
  <!-- subtle top sheen -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="#FFFFFF" opacity="0.03"/>

  <!-- pin mark -->
  <g filter="url(#soft)">
    <path d="M512 285
             C 613 285 698 361 698 468
             C 698 560 585 700 512 800
             C 439 700 326 560 326 468
             C 326 361 411 285 512 285 Z"
          fill="url(#pin)"/>
    <!-- availability dot (green = c'è posto) -->
    <circle cx="512" cy="460" r="96" fill="url(#dot)"/>
  </g>
</svg>
